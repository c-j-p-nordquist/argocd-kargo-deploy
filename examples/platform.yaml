# Example answers for a demo installation on a local or homelab cluster.
#
# This file holds references to secrets, never secret values.
# Check it with: akd validate --file examples/platform.yaml
schemaVersion: v1alpha1

access:
  exposure: port-forward

identity:
  oidc:
    issuer: https://accounts.example.com
    clientId: argocd
  adminGroup: platform-admins

git:
  host: github
  credential: github-app

secrets:
  backend: in-cluster

tenancy:
  mode: multi-tenant

promotion:
  production: pull-request

components:
  argoRollouts: disabled

# Every option that weakens the security baseline must be acknowledged here.
acknowledgements:
  - question: secrets-backend
    option: in-cluster
    reason: Demo cluster. The secrets exist only inside the cluster and can be re-created.
