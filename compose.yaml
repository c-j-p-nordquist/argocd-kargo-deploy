services:
  # Development toolchain: tests, vet, and running the CLI from source.
  #   docker compose run --rm dev                      (runs the tests)
  #   docker compose run --rm dev go run ./cmd/akd questions
  dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

  # Supply chain tools (helm, crane, cosign) for generating and checking
  # components.lock. Needs network access to the upstream registries.
  #   docker compose run --rm tools go run ./tools/lockgen
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

  # The release image: static binary on distroless, non-root.
  #   docker compose run --rm akd questions --output json
  akd:
    build:
      context: .
      target: prod
      args:
        VERSION: ${VERSION:-dev}
    profiles: ["cli"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # Throwaway single-node cluster for end-to-end tests. It runs privileged,
  # publishes no ports, and holds nothing worth keeping.
  #   docker compose --profile e2e up -d --wait k3s
  #   docker compose --profile e2e run --rm e2e
  #   docker compose --profile e2e rm -sfv k3s e2e
  k3s:
    image: rancher/k3s:v1.37.2-k3s1@sha256:21ea6e0fac4e3930c2ce8aa40ddd41a8b18cb3e9a0222c030dc005e7e88c4332
    profiles: ["e2e"]
    command: ["server", "--disable=traefik", "--disable=metrics-server"]
    privileged: true
    tmpfs: ["/run", "/var/run"]
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - e2e-kubeconfig:/output
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Runs the release image against the throwaway cluster. It shares the
  # cluster's network namespace, so the kubeconfig's 127.0.0.1 address works.
  e2e:
    build:
      context: .
      target: prod
    profiles: ["e2e"]
    network_mode: "service:k3s"
    depends_on:
      k3s:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - e2e-kubeconfig:/kube:ro
    command: ["preflight", "--kubeconfig", "/kube/kubeconfig.yaml"]

volumes:
  go-mod:
  go-build:
  e2e-kubeconfig:
