name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit. Update the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: docker compose run --rm dev sh -c 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

      - name: Vet
        run: docker compose run --rm dev go vet ./...

      - name: Test
        run: docker compose run --rm dev go test ./...

      - name: Build release image
        run: docker compose --profile cli build akd

      - name: Smoke test release image
        run: |
          docker compose --profile cli run --rm akd questions --output json
          docker compose --profile cli run --rm -T akd validate --file - < examples/platform.yaml

      - name: Plan from the example answers
        run: docker compose run --rm dev go run ./cmd/akd plan --file examples/platform.yaml --out /tmp/plan

      - name: End-to-end preflight against a throwaway cluster
        run: |
          docker compose --profile e2e up -d --wait k3s
          docker compose --profile e2e run --rm e2e preflight --kubeconfig /kube/kubeconfig.yaml --output json

      - name: End-to-end install of the bootstrap stage
        run: docker compose --profile e2e run --rm e2e-install

      - name: Show cluster logs on failure
        if: failure()
        run: |
          docker compose --profile e2e exec -T k3s kubectl get pods --all-namespaces || true
          docker compose --profile e2e exec -T k3s kubectl get events --namespace argocd --sort-by .lastTimestamp || true
          docker compose --profile e2e logs --tail 100 k3s

  # Re-resolves every pinned chart and image and re-verifies every signature.
  # Fails if components.lock is stale or an upstream tag has moved.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the lock and rendered manifests against upstream
        run: docker compose --profile tools run --rm tools go run ./tools/lockgen -check
